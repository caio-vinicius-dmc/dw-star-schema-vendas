services:
  postgres:
    image: postgres:17-alpine
    container_name: dw_vendas_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dw_local}
      POSTGRES_DB: ${POSTGRES_DB:-vendas_dw}
    ports:
      - "${POSTGRES_PORT:-15434}:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dw} -d ${POSTGRES_DB:-vendas_dw}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  dados_postgres:
